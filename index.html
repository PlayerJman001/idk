<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>

    <style>
        * {
            padding: 0;
            margin: 0;
        }
        canvas {
            background: #eeeeee;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="480" height="320"></canvas>
    <button id="runButton">Start</button>
    

    <!-- Some wierd bug is causing js to not working when in it's own standalone file, so that is why I'll be doing the js in the html, altough it's not usually what I do-->

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        document.addEventListener("keydown", keyDownHandler);
        document.addEventListener("keyup", keyUpHandler);

        const ballRadius = 10; //Ball hitbox and size

        let x = canvas.width / 2;
        let y = canvas.height - 30;

        let dx = 2;
        let dy = -2;

        let leftClick = false;
        let rightClick = false;

        const paddleHeight = 10;
        const paddleWidth = 75;

        let paddleX = (canvas.width - paddleWidth) / 2;

        let interval = 0;

        const difficultyIncrease = 1.3



        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "red";
            ctx.fill();
            ctx.closePath();
        }


        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBall();
            drawPaddle();
            x += dx;
            y += dy;    

            //detection from top and bottom, we're using ball radius because if we don't, the code will only await untill the center of the ball reaches the coordinates

            if (y + dy < ballRadius) {
                dy = -dy;
            } else if (y + dy > canvas.height - ballRadius) {
                if (x > paddleX && x < paddleX + paddleHeight) {
                    dy = -dy;
                } else if (x > paddleX + ballRadius && x < paddleX + paddleWidth + ballRadius) {
                    y -= paddleHeight
                    dy = -dy;
                    dx *= difficultyIncrease;
                    dy *= difficultyIncrease;
                } else {
                    alert("GAME OVER");
                    document.location.reload();
                    clearInterval(interval);
                }
            }

            //detection left right
            if (x + dx < ballRadius || x + dx > canvas.width - ballRadius) {
                dx = -dx;
            }

            //to prevent the paddle going off screen, we're setting a minimum and a maximum value, being the right wall - the paddle width, and well, 0, being left
            
            if (rightClick) {
                paddleX = Math.min(paddleX + 4, canvas.width - paddleWidth);
            } else if (leftClick) {
                paddleX = Math.max(paddleX - 4, 0);
            }
        }

        function startGame() {
            interval = setInterval(draw, 10);
        }

        const runButton = document.getElementById("runButton");
        runButton.addEventListener("click", () => {
            startGame();
            runButton.disabled = true;
        })

        //paddle stuff (who calls it paddle lmao)

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
            ctx.fillStyle = "#0095DD"; //mmmm lovley, today I learn it was case sensitive
            ctx.fill();
            ctx.closePath();
        }
        

        //paddle controls (still who calls it a paddle)

        function keyDownHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightClick = true;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftClick = true;
            }
        }

        function keyUpHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightClick = false;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftClick = false;
            }
        }
    </script>
</body>
</html>
