<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>

    <style>
        * {
            padding: 0;
            margin: 0;
        }
        canvas {
            background: #eeeeee;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="480" height="320"></canvas>
    <button id="runButton">Start</button>
    

    <!-- Some wierd bug is causing js to not working when in it's own standalone file, so that is why I'll be doing the js in the html, altough it's not usually what I do-->

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const ballRadius = 10; //Ball hitbox and size

        let x = canvas.width / 2;
        let y = canvas.height - 30;

        let dx = 2;
        let dy = -2;

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "red";
            ctx.fill();
            ctx.closePath();
        }


        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height)
            drawBall();
            x += dx;
            y += dy;    

            //detection from top and bottom 
            if (y + dy < 0 || y + dy > canvas.height) {
                dy = -dy;
            }

            //detection left right
            if (x + dx < 0 || x + dx > canvas.width) {
                dx = -dx;
            }
        }

        function startGame() {
            setInterval(draw, 10);
        }

        const runButton = document.getElementById("runButton");
        runButton.addEventListener("click", () => {
            startGame();
            runButton.disabled = true
        })

    </script>
</body>
</html>
